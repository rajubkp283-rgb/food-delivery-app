<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Restaurants</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        .header {
            background: #222;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 22px;
        }

        .logout-btn {
            background: white;
            color: #222;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .restaurant-list {
            display: grid;
            gap: 15px;
        }

        .restaurant-card {
            background: white;
            border-radius: 12px;
            padding: 20px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .restaurant-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .restaurant-name {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .approved {
            background: #e7f8ed;
            color: #16833b;
        }

        .pending {
            background: #fff4d6;
            color: #a66b00;
        }

        .banned {
            background: #ffe8e8;
            color: #d22;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }

        .detail {
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 7px;
        }

        .label {
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve-btn {
            background: #16833b;
            color: white;
        }

        .reject-btn {
            background: #d22;
            color: white;
        }

        .refresh-btn {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .error {
            color: #d22;
        }

        @media (max-width: 750px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .restaurant-top {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        
/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}

    </style>

</head>


<body>


    <div class="header">

        <h2>⚙️ Admin Panel</h2>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>


    <div class="container">


        <div class="title">

            <h1>Restaurant Management</h1>

            <p>
                Manage registered restaurants and approval requests.
            </p>

        </div>


        <div class="stats">

            <div class="stat-card">

                <div>Total Restaurants</div>

                <div
                    class="number"
                    id="totalCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div>Pending Approval</div>

                <div
                    class="number"
                    id="pendingCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div>Approved</div>

                <div
                    class="number"
                    id="approvedCount">
                    0
                </div>

            </div>

        </div>


        <button
            class="refresh-btn"
            onclick="loadRestaurants()">
            🔄 Refresh
        </button>


        <div id="loading"
             class="loading">

            Loading restaurants...

        </div>


        <div id="error"
             class="error"
             style="display:none;">
        </div>


        <div
            id="restaurantList"
            class="restaurant-list">
        </div>


        <!-- DELIVERY BOY MANAGEMENT -->

<div style="margin-top:50px;">

    <div class="title">
        <h1>🛵 Delivery Boy Management</h1>

        <p>
            Manage registered delivery boys and approval requests.
        </p>
    </div>

    <button
        class="refresh-btn"
        onclick="loadDeliveryBoys()">
        🔄 Refresh Delivery Boys
    </button>

    <div
        id="deliveryBoyLoading"
        class="loading">
        Loading delivery boys...
    </div>

    <div
        id="deliveryBoyError"
        class="error"
        style="display:none;">
    </div>

    <div
        id="deliveryBoyList"
        class="restaurant-list">
    </div>

</div>


    </div>


<script>




async function loadDeliveryBoys() {

    const token =
        localStorage.getItem("adminToken");

    if (!token) {
        document.getElementById(
            "deliveryBoyError"
        ).textContent =
            "Admin login required. Admin token not found.";

        document.getElementById(
            "deliveryBoyError"
        ).style.display = "block";

        return;
    }

    const loading =
        document.getElementById(
            "deliveryBoyLoading"
        );

    const errorBox =
        document.getElementById(
            "deliveryBoyError"
        );

    const list =
        document.getElementById(
            "deliveryBoyList"
        );

    loading.style.display = "block";
    errorBox.style.display = "none";
    list.innerHTML = "";

    try {

        const response = await fetch(
            "/api/admin/delivery-boys",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Failed to load delivery boys"
            );
        }

        const deliveryBoys =
            data.deliveryBoys || [];

        loading.style.display = "none";

        if (deliveryBoys.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    No delivery boys registered yet.
                </div>
            `;

            return;
        }

        deliveryBoys.forEach(boy => {

            const card =
                document.createElement("div");

            card.className =
                "restaurant-card";

            const status =
                boy.isApproved
                    ? "APPROVED"
                    : "PENDING";

            const statusClass =
                boy.isApproved
                    ? "approved"
                    : "pending";

            card.innerHTML = `

    <div class="restaurant-top">

        <div class="restaurant-name">
            🛵 ${escapeHTML(
                boy.name || "Delivery Boy"
            )}
        </div>

        <span class="status ${statusClass}">
            ${status}
        </span>

    </div>

    <div style="
        margin-top:10px;
        line-height:1.8;
    ">

        📞 ${escapeHTML(
            boy.phone || "-"
        )}

        <br>

        📍 ${escapeHTML(
            boy.city || "-"
        )}

        <br>

        🚗 ${escapeHTML(
            boy.vehicleType || "-"
        )}

        <br>

        🔢 ${escapeHTML(
            boy.vehicleNumber || "-"
        )}

        <br>

        ${
            boy.isOnline
                ? "🟢 Online"
                : "⚪ Offline"
        }

    </div>

    ${
        !boy.isApproved
            ? `
                <button
                    class="btn approve-btn"
                    onclick="approveDeliveryBoy('${boy._id}')"
                    style="margin-top:15px;"
                >
                    ✅ Approve
                </button>
            `
            : `
                <div style="
                    margin-top:15px;
                    color:#16833b;
                    font-weight:bold;
                ">
                    ✅ Delivery Boy Approved
                </div>
            `
    }

`;

            list.appendChild(card);

        });

    } catch (error) {

        console.error(
            "Load Delivery Boys Error:",
            error
        );

        loading.style.display = "none";

        errorBox.textContent =
            error.message;

        errorBox.style.display =
            "block";
    }
}





async function approveDeliveryBoy(id) {

    const token =
        localStorage.getItem("adminToken");

    if (!token) {
        alert("Admin login required.");
        return;
    }

    if (!confirm(
        "Are you sure you want to approve this Delivery Boy?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/delivery-boys/"
                + id
                + "/approve",
                {
                    method: "PATCH",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Delivery Boy approval failed"
            );
        }

        alert(
            "Delivery Boy approved successfully!"
        );

        loadDeliveryBoys();

    } catch (error) {

        console.error(
            "Approve Delivery Boy Error:",
            error
        );

        alert(
            error.message
        );
    }
}





async function loadRestaurants() {

    const token =
        localStorage.getItem("adminToken");


    if (!token) {

        showError(
            "Admin login required. Admin token not found."
        );

        return;
    }


    document.getElementById("loading")
        .style.display = "block";

    document.getElementById("error")
        .style.display = "none";

    document.getElementById("restaurantList")
        .innerHTML = "";


    try {

        const response =
            await fetch(
                "/api/admin/restaurants",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load restaurants"
            );
        }


        const restaurants =
            data.restaurants || [];


        document.getElementById("totalCount")
            .textContent =
            restaurants.length;


        const pending =
            restaurants.filter(
                r => !r.isApproved
            ).length;


        const approved =
            restaurants.filter(
                r => r.isApproved
            ).length;


        document.getElementById("pendingCount")
            .textContent = pending;


        document.getElementById("approvedCount")
            .textContent = approved;


        document.getElementById("loading")
            .style.display = "none";


        if (restaurants.length === 0) {

            document.getElementById(
                "restaurantList"
            ).innerHTML = `
                <div class="empty">
                    No restaurants registered yet.
                </div>
            `;

            return;
        }


        restaurants.forEach(
            restaurant => {

                createRestaurantCard(
                    restaurant
                );

            }
        );


    } catch (error) {

        console.error(
            "Load Restaurants Error:",
            error
        );

        showError(
            error.message
        );

    }

}


function createRestaurantCard(restaurant) {

    const list =
        document.getElementById(
            "restaurantList"
        );


    let statusHTML;


    if (restaurant.isBanned) {

        statusHTML = `
            <span class="status banned">
                BANNED
            </span>
        `;

    } else if (restaurant.isApproved) {

        statusHTML = `
            <span class="status approved">
                APPROVED
            </span>
        `;

    } else {

        statusHTML = `
            <span class="status pending">
                PENDING
            </span>
        `;
    }


    const card =
        document.createElement("div");


    card.className =
        "restaurant-card";


    card.innerHTML = `

        <div class="restaurant-top">

            <div class="restaurant-name">
                🍽️ ${escapeHTML(
                    restaurant.name || "-"
                )}
            </div>

            <div>
                ${statusHTML}
            </div>

        </div>


        <div class="details">

            <div class="detail">

                <div class="label">
                    Owner
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.ownerName || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    Phone
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.phone || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    Email
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.email || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    City
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.city || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    Category
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.category || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    Address
                </div>

                <div class="value">
                    ${escapeHTML(
                        restaurant.address || "-"
                    )}
                </div>

            </div>

        </div>


        <div class="actions">

            ${
                restaurant.isApproved

                ? `

                    <button
                        class="btn reject-btn"
                        onclick="rejectRestaurant(
                            '${restaurant._id}'
                        )">

                        ❌ Reject

                    </button>

                  `

                : `

                    <button
                        class="btn approve-btn"
                        onclick="approveRestaurant(
                            '${restaurant._id}'
                        )">

                        ✅ Approve

                    </button>

                  `
            }

        </div>

    `;


    list.appendChild(card);

}


async function approveRestaurant(id) {

    const token =
        localStorage.getItem("adminToken");


    if (!confirm(
        "Are you sure you want to approve this restaurant?"
    )) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/admin/restaurants/"
                + id
                + "/approve",
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Approval failed"
            );
        }


        alert(
            "Restaurant approved successfully!"
        );


        loadRestaurants();


    } catch (error) {

        alert(
            error.message
        );

    }

}


async function rejectRestaurant(id) {

    const token =
        localStorage.getItem("adminToken");


    if (!confirm(
        "Are you sure you want to reject this restaurant?"
    )) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/admin/restaurants/"
                + id
                + "/reject",
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Reject failed"
            );
        }


        alert(
            "Restaurant rejected successfully!"
        );


        loadRestaurants();


    } catch (error) {

        alert(
            error.message
        );

    }

}


function showError(message) {

    document.getElementById("loading")
        .style.display = "none";

    const errorBox =
        document.getElementById("error");

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function logout() {

    localStorage.removeItem(
        "adminToken"
    );

    window.location.href =
        "index.html";

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}


loadRestaurants();


</script>


</body>

</html>
