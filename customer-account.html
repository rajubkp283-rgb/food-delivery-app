<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account - FoodExpress</title>

    <style>
        * {
    box-sizing: border-box;
}

html {
    background: #090d20;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #090d20;
    color: #ffffff;
}

/* =========================
   MAIN APP CONTAINER
========================= */

.app-container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: 0 auto;

    background: #0b1224;

    border-top: 1px solid rgba(92,125,180,.75);
    border-left: 1px solid rgba(92,125,180,.75);
    border-right: 1px solid rgba(92,125,180,.75);
    border-bottom: 1px solid rgba(92,125,180,.75);

    box-shadow:
        0 0 25px rgba(71,115,190,.12);

    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    background: #0b1224;

    padding: 14px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #334b78;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 21px;
    font-weight: 800;

    color: #ffffff;

    cursor: pointer;

    letter-spacing: -.3px;
}

.back-btn {
    border: 1px solid #38527f;

    background: #142039;

    color: #ffffff;

    padding: 9px 13px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 12px;
    font-weight: 700;

    transition: .2s ease;
}

.back-btn:hover {
    background: #192847;
    border-color: #49658f;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 500px;

    margin: 0 auto;

    padding: 14px 14px 25px;
}

/* =========================
   PROFILE CARD
========================= */

.profile-card {
    background:
        linear-gradient(
            145deg,
            #142039,
            #111b31
        );

    border: 1px solid #2d4167;

    border-radius: 15px;

    padding: 14px;

    margin-bottom: 10px;

    box-shadow:
        0 5px 16px rgba(0,0,0,.14);
}

.profile-top {
    display: flex;
    align-items: center;

    gap: 11px;

    margin-bottom: 12px;
}

.avatar {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ff3f4a,
            #c92d3a
        );

    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: 800;

    box-shadow:
        0 5px 12px rgba(255,63,74,.18);
}

.profile-name {
    font-size: 16px;
    font-weight: 800;

    color: #ffffff;

    line-height: 1.3;
}

.profile-label {
    color: #8fa2c2;

    font-size: 10px;

    margin-top: 3px;
}

/* =========================
   INFORMATION ROW
========================= */

.info-row {
    padding: 8px 0;

    border-bottom:
        1px solid rgba(92,125,180,.13);
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    font-size: 10px;

    color: #7186a9;

    margin-bottom: 3px;
}

.info-value {
    font-size: 12px;

    color: #ffffff;

    font-weight: 700;

    line-height: 1.4;

    overflow-wrap: anywhere;
}

/* =========================
   MENU CARD
========================= */

.menu-card {
    background:
        linear-gradient(
            145deg,
            #142039,
            #111b31
        );

    border: 1px solid #2d4167;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 5px 16px rgba(0,0,0,.14);
}

.menu-item {
    width: 100%;

    border: none;

    background: transparent;

    color: #ffffff;

    padding: 13px 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    cursor: pointer;

    border-bottom:
        1px solid rgba(92,125,180,.13);

    font-size: 13px;

    font-weight: 700;

    text-align: left;

    transition: .2s ease;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item:hover {
    background: rgba(255,255,255,.025);
}

.menu-left {
    display: flex;

    align-items: center;

    gap: 10px;
}

.menu-icon {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #192847;

    border: 1px solid #38527f;

    border-radius: 9px;

    font-size: 15px;
}

.menu-item > span:last-child {
    color: #8fa2c2;
    font-size: 20px;
}

.logout {
    color: #ff6b73;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    padding: 35px 15px;

    color: #8fa2c2;

    font-size: 12px;
}

/* =========================
   ERROR
========================= */

.error {
    background: rgba(255,63,74,.10);

    color: #ff6b73;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid rgba(255,63,74,.25);

    font-size: 12px;
}

/* =========================
   ADDRESS INPUTS
========================= */

#addressContainer input,
#addressContainer textarea {
    width: 100% !important;

    background: #101a30 !important;

    color: #ffffff !important;

    border: 1px solid #2d4167 !important;

    border-radius: 9px !important;

    padding: 10px 11px !important;

    font-size: 12px !important;

    outline: none !important;
}

#addressContainer input::placeholder,
#addressContainer textarea::placeholder {
    color: #7186a9 !important;
}

#addressContainer input:focus,
#addressContainer textarea:focus {
    border-color: #49658f !important;

    box-shadow:
        0 0 0 2px rgba(73,101,143,.12);
}

/* =========================
   ADDRESS BUTTONS
========================= */

#addressContainer button {
    border-radius: 9px !important;

    font-size: 11px !important;

    padding: 9px 13px !important;

    transition: .2s ease;
}

#addressContainer button[onclick="editAddress()"],
#addressContainer button[onclick="saveAddress()"] {
    background: #ff3f4a !important;

    color: #ffffff !important;

    border: 1px solid rgba(255,63,74,.35) !important;
}

#addressContainer button[onclick="loadAddress()"] {
    background: #192847 !important;

    color: #ffffff !important;

    border: 1px solid #38527f !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .app-container {
        max-width: 500px;

        border-left: none;
        border-right: none;
    }

    .header {
        padding: 13px 14px;
    }

    .logo {
        font-size: 19px;
    }

    .back-btn {
        padding: 8px 11px;

        font-size: 11px;
    }

    .container {
        padding: 12px 12px 22px;
    }

    .profile-card {
        padding: 13px;

        border-radius: 14px;
    }

    .profile-top {
        gap: 10px;

        margin-bottom: 10px;
    }

    .avatar {
        width: 44px;
        height: 44px;

        border-radius: 11px;

        font-size: 18px;
    }

    .profile-name {
        font-size: 15px;
    }

    .menu-item {
        padding: 12px 13px;

        font-size: 12px;
    }
}


/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}

    </style>
</head>

<body>

    <div class="app-container">

<header class="header">

    <div
        class="logo"
        onclick="window.location.href='food-index.html'"
    >
        FoodExpress
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='food-index.html'"
    >
        🏠 Home
    </button>

</header>


<main class="container">

    <div id="accountContainer">

        <div class="loading">
            Loading account...
        </div>

    </div>

</main>

</div>


<script>

const token =
    localStorage.getItem("authToken");


/* Check Login */
if (!token) {

    window.location.href =
        "food-login.html";

}


/* Load Customer Profile */
async function loadAccount() {

    try {

        const response =
            await fetch(
                "/api/auth/profile",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load account"
            );

        }


        const user =
            data.user || data.customer || {};


        const name =
            user.name ||
            user.fullName ||
            "Customer";


        const phone =
            user.phone ||
            "Not available";


        const email =
            user.email ||
            "Not available";


        const firstLetter =
            name
                .trim()
                .charAt(0)
                .toUpperCase();


        document.getElementById(
            "accountContainer"
        ).innerHTML = `

            <div class="profile-card">

                <div class="profile-top">

                    <div class="avatar">
                        ${firstLetter}
                    </div>

                    <div>

                        <div class="profile-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="profile-label">
                            FoodExpress Customer
                        </div>

                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Name
                    </div>

                    <div class="info-value">
                        ${escapeHtml(name)}
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Phone
                    </div>

                    <div class="info-value">
                        ${escapeHtml(phone)}
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Email
                    </div>

                    <div class="info-value">
                        ${escapeHtml(email)}
                    </div>

                </div>

            </div>


<div class="profile-card">

    <div class="profile-top">

        <div class="avatar">
            📍
        </div>

        <div>
            <div class="profile-name">
                Delivery Address
            </div>

            <div class="profile-label">
                Your saved delivery address
            </div>
        </div>

    </div>

    <div id="addressContainer">

        <div class="loading">
            Loading address...
        </div>

    </div>

</div>



            <div class="menu-card">

                <button
                    class="menu-item"
                    onclick="window.location.href='customer-orders.html'"
                >

                    <span class="menu-left">

                        <span class="menu-icon">
                            📦
                        </span>

                        My Orders

                    </span>

                    <span>›</span>

                </button>


                <button
                    class="menu-item"
                    onclick="window.location.href='food-index.html'"
                >

                    <span class="menu-left">

                        <span class="menu-icon">
                            🍔
                        </span>

                        Order Food

                    </span>

                    <span>›</span>

                </button>


                <button
                    class="menu-item logout"
                    onclick="logout()"
                >

                    <span class="menu-left">

                        <span class="menu-icon">
                            🚪
                        </span>

                        Logout

                    </span>

                    <span>›</span>

                </button>

            </div>

        `;

    } catch (error) {

        console.error(
            "Account Error:",
            error
        );


        document.getElementById(
            "accountContainer"
        ).innerHTML = `

            <div class="error">
                ${escapeHtml(error.message)}
            </div>

        `;

    }

}


/* Logout */
function logout() {

    localStorage.removeItem(
        "authToken"
    );

    window.location.href =
        "food-login.html";

}


/* Security */
function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* Load Delivery Address */
async function loadAddress() {

    try {

        const response =
            await fetch(
                "/api/customer/address",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load address"
            );

        }

        const address =
            data.address || {};

        const addressContainer =
            document.getElementById(
                "addressContainer"
            );

        if (!addressContainer) return;

        const hasAddress =
            address.address ||
            address.city ||
            address.pincode;

        if (!hasAddress) {

            addressContainer.innerHTML = `
                <div style="
                    color:#777;
                    padding:10px 0;
                ">
                    No delivery address saved yet.
                </div>

                <button
                    onclick="editAddress()"
                    style="
                        margin-top:10px;
                        border:none;
                        background:#e23744;
                        color:white;
                        padding:10px 16px;
                        border-radius:8px;
                        font-weight:600;
                        cursor:pointer;
                    "
                >
                    + Add Address
                </button>
            `;

            return;
        }

        addressContainer.innerHTML = `

            <div class="info-row">

                <div class="info-label">
                    Name
                </div>

                <div class="info-value">
                    ${escapeHtml(address.name || "Not available")}
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    Phone
                </div>

                <div class="info-value">
                    ${escapeHtml(address.phone || "Not available")}
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    Address
                </div>

                <div class="info-value">
                    ${escapeHtml(address.address || "Not available")}
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    City
                </div>

                <div class="info-value">
                    ${escapeHtml(address.city || "Not available")}
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    Pincode
                </div>

                <div class="info-value">
                    ${escapeHtml(address.pincode || "Not available")}
                </div>

            </div>

            <button
                onclick="editAddress()"
                style="
                    margin-top:15px;
                    border:none;
                    background:#e23744;
                    color:white;
                    padding:10px 16px;
                    border-radius:8px;
                    font-weight:600;
                    cursor:pointer;
                "
            >
                ✏️ Edit Address
            </button>

        `;

    } catch (error) {

        console.error(
            "Address Error:",
            error
        );

        const addressContainer =
            document.getElementById(
                "addressContainer"
            );

        if (addressContainer) {

            addressContainer.innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message)}
                </div>
            `;

        }

    }

}

/* Start */
loadAccount();
loadAddress();


/* Edit / Add Delivery Address */
function editAddress() {

    const addressContainer =
        document.getElementById("addressContainer");

    if (!addressContainer) return;

    addressContainer.innerHTML = `

        <div class="info-row">

            <div class="info-label">
                Full Name
            </div>

            <input
                type="text"
                id="addressName"
                placeholder="Enter your name"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    font-size:14px;
                    outline:none;
                "
            >

        </div>


        <div class="info-row">

            <div class="info-label">
                Phone Number
            </div>

            <input
                type="text"
                id="addressPhone"
                placeholder="Enter phone number"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    font-size:14px;
                    outline:none;
                "
            >

        </div>


        <div class="info-row">

            <div class="info-label">
                Address
            </div>

            <textarea
                id="addressText"
                placeholder="House / Street / Area"
                rows="3"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    font-size:14px;
                    outline:none;
                    resize:vertical;
                "
            ></textarea>

        </div>


        <div class="info-row">

            <div class="info-label">
                City
            </div>

            <input
                type="text"
                id="addressCity"
                placeholder="Enter city"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    font-size:14px;
                    outline:none;
                "
            >

        </div>


        <div class="info-row">

            <div class="info-label">
                Pincode
            </div>

            <input
                type="text"
                id="addressPincode"
                placeholder="Enter pincode"
                maxlength="6"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    font-size:14px;
                    outline:none;
                "
            >

        </div>


        <button
            onclick="saveAddress()"
            style="
                margin-top:15px;
                border:none;
                background:#e23744;
                color:white;
                padding:11px 18px;
                border-radius:8px;
                font-weight:600;
                cursor:pointer;
            "
        >
            💾 Save Address
        </button>

        <button
            onclick="loadAddress()"
            style="
                margin-top:15px;
                margin-left:8px;
                border:none;
                background:#f3f4f6;
                color:#222;
                padding:11px 18px;
                border-radius:8px;
                font-weight:600;
                cursor:pointer;
            "
        >
            Cancel
        </button>

    `;
}


/* Save Delivery Address */
async function saveAddress() {

    try {

        const name =
            document.getElementById("addressName").value.trim();

        const phone =
            document.getElementById("addressPhone").value.trim();

        const address =
            document.getElementById("addressText").value.trim();

        const city =
            document.getElementById("addressCity").value.trim();

        const pincode =
            document.getElementById("addressPincode").value.trim();


        if (!name || !phone || !address || !city || !pincode) {

            alert("Please fill all address details.");

            return;

        }


        if (!/^\d{10}$/.test(phone)) {

            alert("Please enter a valid 10 digit phone number.");

            return;

        }


        if (!/^\d{6}$/.test(pincode)) {

            alert("Please enter a valid 6 digit pincode.");

            return;

        }


        const response =
            await fetch(
                "/api/customer/address",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        name,
                        phone,
                        address,
                        city,
                        pincode
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to save address"
            );

        }


        alert("Address saved successfully!");


        await loadAddress();


    } catch (error) {

        console.error(
            "Save Address Error:",
            error
        );

        alert(
            error.message ||
            "Failed to save address."
        );

    }

}

</script>

</body>
</html>
