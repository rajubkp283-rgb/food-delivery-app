<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders</title>

    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* =========================
   PAGE
========================= */

html {
    background: #090d20;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090d20;
    color: #ffffff;
}

/* =========================
   MAIN APP
========================= */

.app-container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: 0 auto;

    background: #0b1224;

    border-top: 1px solid rgba(92,125,180,.75);
    border-left: 1px solid rgba(92,125,180,.75);
    border-right: 1px solid rgba(92,125,180,.75);
    border-bottom: 1px solid rgba(92,125,180,.75);

    box-shadow: 0 0 25px rgba(71,115,190,.12);

    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    background: #0b1224;
    color: #ffffff;

    padding: 16px;

    display: flex;
    align-items: center;
    gap: 12px;

    border-bottom: 1px solid #334b78;
}

.header h2 {
    margin: 0;

    font-size: 20px;
    line-height: 1.2;

    font-weight: 700;
}

/* =========================
   BACK BUTTON
========================= */

.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    white-space: nowrap;
    width: auto;
    min-width: 50px;
    height: 42px;

    padding: 0 12px;
    border-radius: 12px;

    background: #142039;
    border: 1px solid #2d4167;
    color: #fff;

    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
}

.back-btn:hover {
    background: #192847;
    transform: translateY(-1px);
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 500px;

    margin: auto;

    padding: 14px;
}



/* =========================
   PREMIUM ORDER CARD
========================= */

/* =========================
   PREMIUM RECEIPT ORDER CARD
========================= */

.order-card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #142039,
            #10192d
        );

    border: 1px solid #3a527d;

    border-radius: 14px;

    padding: 13px 14px 12px;

    margin-bottom: 13px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.18);

    overflow: visible;

    transition: .2s ease;
}

/* Receipt zig-zag LEFT */
.order-card::before {
    content: "";

    position: absolute;

    left: -1px;
    top: 12px;
    bottom: 12px;

    width: 7px;

    background:
        radial-gradient(
            circle at 0 50%,
            #0b1224 0 4px,
            transparent 4.5px
        );

    background-size: 7px 14px;

    background-position: left center;

    pointer-events: none;
}

/* Receipt zig-zag RIGHT */
.order-card::after {
    content: "";

    position: absolute;

    right: -1px;
    top: 12px;
    bottom: 12px;

    width: 7px;

    background:
        radial-gradient(
            circle at 100% 50%,
            #0b1224 0 4px,
            transparent 4.5px
        );

    background-size: 7px 14px;

    background-position: right center;

    pointer-events: none;
}

.order-card:hover {
    border-color: #4d6997;

    transform: translateY(-1px);

    box-shadow:
        0 9px 24px rgba(0,0,0,.22);
}


/* =========================
   TOP
========================= */

.order-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 3px;

    padding-left: 2px;
}

.restaurant {
    min-width: 0;

    color: #ffffff;

    font-size: 14px;

    font-weight: 800;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   STATUS
========================= */

.status {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    padding: 4px 9px;

    border-radius: 20px;

    background: rgba(255,63,74,.10);

    border: 1px solid rgba(255,63,74,.32);

    color: #ff6971;

    font-size: 9px;

    font-weight: 800;

    white-space: nowrap;
}

.status.delivered {
    background: rgba(105,210,143,.10);

    border-color: rgba(105,210,143,.30);

    color: #69d28f;
}

.status.cancelled {
    background: rgba(255,63,74,.10);

    border-color: rgba(255,63,74,.30);

    color: #ff6971;
}


/* =========================
   ORDER ID
========================= */

.order-id {
    color: #7186a9;

    font-size: 9px;

    line-height: 1.3;

    margin-bottom: 8px;

    padding-left: 2px;

    word-break: break-all;
}


/* =========================
   DETAILS
   NO INNER BOX
========================= */

.order-info-grid {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    gap: 0;

    margin-top: 3px;

    padding: 9px 0;

    border-top:
        1px dashed rgba(92,125,180,.25);

    border-bottom:
        1px dashed rgba(92,125,180,.25);
}

.order-info-box {
    background: transparent;

    border: none;

    border-radius: 0;

    padding: 0 9px;

    min-height: auto;

    border-right:
        1px solid rgba(92,125,180,.16);
}

.order-info-box:first-child {
    padding-left: 2px;
}

.order-info-box:last-child {
    border-right: none;

    padding-right: 2px;
}

.order-info-label {
    display: block;

    color: #7186a9;

    font-size: 8px;

    margin-bottom: 3px;

    white-space: nowrap;
}

.order-info-value {
    display: block;

    color: #ffffff;

    font-size: 11px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   DATE
========================= */

.order-date {
    color: #8fa2c2;

    font-size: 9px;

    margin-top: 8px;

    padding-left: 2px;

    line-height: 1.4;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    gap: 8px;

    margin-top: 9px;
}

.btn {
    flex: 1;

    min-height: 35px;

    border-radius: 9px;

    padding: 7px 8px;

    cursor: pointer;

    font-size: 10px;

    font-weight: 800;

    border: 1px solid transparent;

    transition: .2s ease;
}


/* VIEW BUTTON */

.view-btn {
    background: #192847;

    border-color: #38527f;

    color: #ffffff;
}

.view-btn:hover {
    background: #213458;

    border-color: #49658f;
}


/* TRACK BUTTON */

.track-btn {
    background: #ff3f4a;

    border-color: rgba(255,63,74,.35);

    color: #ffffff;

    box-shadow:
        0 4px 10px rgba(255,63,74,.12);
}

.track-btn:hover {
    background: #f03440;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
    text-align: center;

    background: #142039;

    border: 1px solid #2d4167;

    border-radius: 14px;

    padding: 35px 20px;

    color: #8fa2c2;

    box-shadow: 0 5px 14px rgba(0,0,0,.10);
}

.empty div {
    margin-bottom: 8px;
}

.empty h3 {
    color: #ffffff;

    font-size: 16px;

    margin-bottom: 6px;
}

.empty p {
    color: #8fa2c2;

    font-size: 12px;

    line-height: 1.5;

    margin-bottom: 15px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    padding: 45px 10px;

    color: #8fa2c2;

    font-size: 13px;
}

/* =========================
   ERROR
========================= */

.error {
    background: rgba(255,63,74,.08);

    border: 1px solid rgba(255,63,74,.25);

    border-radius: 12px;

    padding: 14px;

    text-align: center;

    color: #ff6b73;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    .app-container {
        border-left: none;
        border-right: none;
    }

    .header {
        padding: 14px;
    }

    .header h2 {
        font-size: 18px;
    }

    .back-btn {
        width: 38px;
        height: 38px;

        font-size: 17px;
    }

    .container {
        padding: 12px;
    }

    .order-card {
    padding: 12px 12px 11px;
    border-radius: 13px;
    margin-bottom: 11px;
}

.restaurant {
    font-size: 13px;
}

.order-id {
    font-size: 8px;
    margin-bottom: 7px;
}

.order-info-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px 0;
    padding: 8px 0;
}

.order-info-box {
    padding: 0 8px;
}

.order-info-box:nth-child(2) {
    border-right: none;
}

.order-info-box:nth-child(1),
.order-info-box:nth-child(3) {
    padding-left: 2px;
}

.order-info-box:nth-child(3),
.order-info-box:nth-child(4) {
    padding-top: 2px;
}

.order-info-label {
    font-size: 8px;
}

.order-info-value {
    font-size: 10px;
}

.order-date {
    font-size: 8px;
    margin-top: 7px;
}

.buttons {
    gap: 7px;
    margin-top: 8px;
}

.btn {
    min-height: 36px;
    font-size: 10px;
}

 



    .status {
        font-size: 9px;

        padding: 5px 8px;
    }

    .buttons {
        gap: 7px;
    }

    .btn {
        min-height: 37px;

        font-size: 10px;

        padding: 8px 6px;
    }

    .empty {
        padding: 30px 16px;
    }
}


/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}

</style>
</head>

<body>

    <div class="app-container">

        <div class="header">

            <button
                class="back-btn"
                onclick="history.back()"
            >
                ←
            </button>

            <h2>My Orders</h2>

        </div>


        <div class="container">

            <div id="ordersContainer">
                <div class="loading">
                    Loading orders...
                </div>
            </div>

        </div>

    </div>

<script>

const authToken =
    localStorage.getItem("authToken");


// Check login
if (!authToken) {

    alert("Please login first.");

    window.location.href = "index.html";

}


// API request
async function loadOrders() {

    try {

        const response = await fetch(
            "/api/orders/my-orders",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        "Bearer " + authToken
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load orders"
            );

        }


        displayOrders(data.orders || []);


    } catch (error) {

        console.error(
            "Load Orders Error:",
            error
        );


        document.getElementById(
            "ordersContainer"
        ).innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;

    }

}


// Display orders
function displayOrders(orders) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">

                <div style="font-size:40px;">
                    📦
                </div>

                <h3>No Orders Yet</h3>

                <p>
                    You have not placed any order yet.
                </p>

                <button
                    class="btn view-btn"
                    style="max-width:220px;"
                    onclick="window.location.href='customer-restaurants.html'"
                >
                    🍔 Order Food
                </button>

            </div>
        `;

        return;
    }


    container.innerHTML =
        orders.map(order => {

            const restaurantName =
                order.restaurantId?.name ||
                "Restaurant";


            const orderDate =
                order.createdAt
                    ? new Date(
                        order.createdAt
                    ).toLocaleString("en-IN")
                    : "N/A";


            let statusClass = "";

            if (
                order.orderStatus ===
                "DELIVERED"
            ) {
                statusClass = "delivered";
            }

            if (
                order.orderStatus ===
                "CANCELLED"
            ) {
                statusClass = "cancelled";
            }


            const canTrack =
                ![
                    "DELIVERED",
                    "CANCELLED"
                ].includes(
                    order.orderStatus
                );


return `

    <div class="order-card">

        <div class="order-top">

            <div class="restaurant">
                🏪 ${escapeHtml(
                    restaurantName
                )}
            </div>

            <span class="status ${statusClass}">
                ${escapeHtml(
                    order.orderStatus ||
                    "UNKNOWN"
                )}
            </span>

        </div>


        <div class="order-id">
            Order ID:
            ${escapeHtml(
                String(order._id)
            )}
        </div>


        <div class="order-info-grid">

            <div class="order-info-box">

                <span class="order-info-label">
                    Payment
                </span>

                <span class="order-info-value">
                    ${escapeHtml(
                        order.paymentMethod ||
                        "N/A"
                    )}
                </span>

            </div>


            <div class="order-info-box">

                <span class="order-info-label">
                    Payment Status
                </span>

                <span class="order-info-value">
                    ${escapeHtml(
                        order.paymentStatus ||
                        "N/A"
                    )}
                </span>

            </div>


            <div class="order-info-box">

                <span class="order-info-label">
                    Total Amount
                </span>

                <span class="order-info-value">
                    ₹${Number(
                        order.totalAmount || 0
                    ).toFixed(2)}
                </span>

            </div>


            <div class="order-info-box">

                <span class="order-info-label">
                    Order Status
                </span>

                <span class="order-info-value">
                    ${escapeHtml(
                        order.orderStatus ||
                        "UNKNOWN"
                    )}
                </span>

            </div>

        </div>


        <div class="order-date">
            🕒 ${escapeHtml(orderDate)}
        </div>


        <div class="buttons">

            <button
                class="btn view-btn"
                onclick="viewOrder('${order._id}')"
            >
                👁️ View Order
            </button>


            ${
                canTrack
                ? `
                    <button
                        class="btn track-btn"
                        onclick="trackOrder('${order._id}')"
                    >
                        📍 Track Order
                    </button>
                `
                : ""
            }

        </div>

    </div>

`;

        }).join("");

}


// View order
function viewOrder(orderId) {

    window.location.href =
        "customer-order.html?id=" +
        encodeURIComponent(orderId);

}


// Track order
function trackOrder(orderId) {

    window.location.href =
        "customer-tracking.html?orderId=" +
        encodeURIComponent(orderId);

}


// Basic HTML escape
function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// Load orders
loadOrders();

</script>

</body>
</html>
