<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders</title>

    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* =========================
   PAGE
========================= */

html {
    background: #090d20;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090d20;
    color: #ffffff;
}

/* =========================
   MAIN APP
========================= */

.app-container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: 0 auto;

    background: #0b1224;

    border-top: 1px solid rgba(92,125,180,.75);
    border-left: 1px solid rgba(92,125,180,.75);
    border-right: 1px solid rgba(92,125,180,.75);
    border-bottom: 1px solid rgba(92,125,180,.75);

    box-shadow: 0 0 25px rgba(71,115,190,.12);

    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    background: #0b1224;
    color: #ffffff;

    padding: 16px;

    display: flex;
    align-items: center;
    gap: 12px;

    
}

.header h2 {
    margin: 0;

    font-size: 20px;
    line-height: 1.2;

    font-weight: 700;
}

/* =========================
   BACK BUTTON
========================= */

.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    white-space: nowrap;
    width: auto;
    min-width: 50px;
    height: 42px;

    padding: 0 12px;
    border-radius: 12px;

    background: #142039;
    border: 1px solid #2d4167;
    color: #fff;

    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
}

.back-btn:hover {
    background: #192847;
    transform: translateY(-1px);
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 500px;

    margin: auto;

    padding: 14px;
}



/* =========================
   PREMIUM ORDER CARD
========================= */

/* =========================
   PREMIUM RECEIPT ORDER CARD
========================= */

.order-card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #142039,
            #10192d
        );

    border: 1px solid #3a527d;

    border-radius: 14px;

    padding: 13px 14px 12px;

    margin-bottom: 13px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.18);

    overflow: visible;

    transition: .2s ease;
}

/* Receipt zig-zag LEFT */
.order-card::before {
    content: "";

    position: absolute;

    left: -1px;
    top: 12px;
    bottom: 12px;

    width: 7px;

    background:
        radial-gradient(
            circle at 0 50%,
            #0b1224 0 4px,
            transparent 4.5px
        );

    background-size: 7px 14px;

    background-position: left center;

    pointer-events: none;
}

/* Receipt zig-zag RIGHT */
.order-card::after {
    content: "";

    position: absolute;

    right: -1px;
    top: 12px;
    bottom: 12px;

    width: 7px;

    background:
        radial-gradient(
            circle at 100% 50%,
            #0b1224 0 4px,
            transparent 4.5px
        );

    background-size: 7px 14px;

    background-position: right center;

    pointer-events: none;
}

.order-card:hover {
    border-color: #4d6997;

    transform: translateY(-1px);

    box-shadow:
        0 9px 24px rgba(0,0,0,.22);
}


/* =========================
   TOP
========================= */

.order-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 3px;

    padding-left: 2px;
}

.restaurant {
    min-width: 0;

    color: #ffffff;

    font-size: 14px;

    font-weight: 800;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   STATUS
========================= */

.status {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    padding: 4px 9px;

    border-radius: 20px;

    background: rgba(255,63,74,.10);

    border: 1px solid rgba(255,63,74,.32);

    color: #ff6971;

    font-size: 9px;

    font-weight: 800;

    white-space: nowrap;
}

.status.delivered {
    background: rgba(105,210,143,.10);

    border-color: rgba(105,210,143,.30);

    color: #69d28f;
}

.status.cancelled {
    background: rgba(255,63,74,.10);

    border-color: rgba(255,63,74,.30);

    color: #ff6971;
}


/* =========================
   ORDER ID
========================= */

.order-id {
    color: #7186a9;

    font-size: 9px;

    line-height: 1.3;

    margin-bottom: 8px;

    padding-left: 2px;

    word-break: break-all;
}


/* =========================
   DETAILS
   NO INNER BOX
========================= */

.order-info-grid {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    gap: 0;

    margin-top: 3px;

    padding: 9px 0;

    border-top:
        1px dashed rgba(92,125,180,.25);

    border-bottom:
        1px dashed rgba(92,125,180,.25);
}

.order-info-box {
    background: transparent;

    border: none;

    border-radius: 0;

    padding: 0 9px;

    min-height: auto;

    border-right:
        1px solid rgba(92,125,180,.16);
}

.order-info-box:first-child {
    padding-left: 2px;
}

.order-info-box:last-child {
    border-right: none;

    padding-right: 2px;
}

.order-info-label {
    display: block;

    color: #7186a9;

    font-size: 8px;

    margin-bottom: 3px;

    white-space: nowrap;
}

.order-info-value {
    display: block;

    color: #ffffff;

    font-size: 11px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   DATE
========================= */

.order-date {
    color: #8fa2c2;

    font-size: 9px;

    margin-top: 8px;

    padding-left: 2px;

    line-height: 1.4;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    gap: 8px;

    margin-top: 9px;
}

.btn {
    flex: 1;

    min-height: 35px;

    border-radius: 9px;

    padding: 7px 8px;

    cursor: pointer;

    font-size: 10px;

    font-weight: 800;

    border: 1px solid transparent;

    transition: .2s ease;
}


/* VIEW BUTTON */

.view-btn {
    background: #192847;

    border-color: #38527f;

    color: #ffffff;
}

.view-btn:hover {
    background: #213458;

    border-color: #49658f;
}


/* TRACK BUTTON */

.track-btn {
    background: #ff3f4a;

    border-color: rgba(255,63,74,.35);

    color: #ffffff;

    box-shadow:
        0 4px 10px rgba(255,63,74,.12);
}

.track-btn:hover {
    background: #f03440;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
    text-align: center;

    background: #142039;

    border: 1px solid #2d4167;

    border-radius: 14px;

    padding: 35px 20px;

    color: #8fa2c2;

    box-shadow: 0 5px 14px rgba(0,0,0,.10);
}

.empty div {
    margin-bottom: 8px;
}

.empty h3 {
    color: #ffffff;

    font-size: 16px;

    margin-bottom: 6px;
}

.empty p {
    color: #8fa2c2;

    font-size: 12px;

    line-height: 1.5;

    margin-bottom: 15px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    padding: 45px 10px;

    color: #8fa2c2;

    font-size: 13px;
}

/* =========================
   ERROR
========================= */

.error {
    background: rgba(255,63,74,.08);

    border: 1px solid rgba(255,63,74,.25);

    border-radius: 12px;

    padding: 14px;

    text-align: center;

    color: #ff6b73;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    .app-container {
        border-left: none;
        border-right: none;
    }

    .header {
        padding: 14px;
    }

    .header h2 {
        font-size: 18px;
    }

    .back-btn {
        width: 38px;
        height: 38px;

        font-size: 17px;
    }

    .container {
        padding: 12px;
    }

    .order-card {
    padding: 12px 12px 11px;
    border-radius: 13px;
    margin-bottom: 11px;
}

.restaurant {
    font-size: 13px;
}

.order-id {
    font-size: 8px;
    margin-bottom: 7px;
}

.order-info-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px 0;
    padding: 8px 0;
}

.order-info-box {
    padding: 0 8px;
}

.order-info-box:nth-child(2) {
    border-right: none;
}

.order-info-box:nth-child(1),
.order-info-box:nth-child(3) {
    padding-left: 2px;
}

.order-info-box:nth-child(3),
.order-info-box:nth-child(4) {
    padding-top: 2px;
}

.order-info-label {
    font-size: 8px;
}

.order-info-value {
    font-size: 10px;
}

.order-date {
    font-size: 8px;
    margin-top: 7px;
}

.buttons {
    gap: 7px;
    margin-top: 8px;
}

.btn {
    min-height: 36px;
    font-size: 10px;
}

 



    .status {
        font-size: 9px;

        padding: 5px 8px;
    }

    .buttons {
        gap: 7px;
    }

    .btn {
        min-height: 37px;

        font-size: 10px;

        padding: 8px 6px;
    }

    .empty {
        padding: 30px 16px;
    }
}


/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}





/* DATE FILTER — MATCH THE PROVIDED SCREENSHOT */
.date-filter-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
    padding: 23px 18px 14px;
   
    
    background: linear-gradient(180deg, #111b30 0%, #0d1629 100%);
    border: 1px solid rgba(54, 87, 143, 0.65);
    border-radius: 19px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
}

/* Heading */
.date-filter-card label {
    position: absolute;
    top: -11px;
    left: 25px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 7px;
    margin: 0;
    background: #111b30;
    color: #f1f5ff;
    font-size: 15px;
    font-weight: 800;
    line-height: 22px;
    white-space: nowrap;
}

/* Calendar icon before heading */
.date-filter-card label::before {
    content: "\1F4C5";
    font-size: 17px;
}

/* Date input and Today button row */
.date-filter-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 98px;
    gap: 10px;
    align-items: stretch;
    width: 100%;
}

/* Date input */
.date-filter-card input[type="date"] {
    width: 100%;
    min-width: 0;
    height: 55px;
    box-sizing: border-box;
    padding: 0 14px;
    margin: 0;
    background: #080f1e;
    border: 1px solid rgba(104, 137, 190, 0.48);
    border-radius: 13px;
    color: #f8fafc;
    color-scheme: dark;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    outline: none;
}

.date-filter-card input[type="date"]:focus {
    border-color: #648ed0;
    box-shadow: 0 0 0 2px rgba(83, 121, 180, 0.16);
}

/* Today button */
.date-filter-card .today-btn {
    width: 100%;
    min-width: 0;
    height: 55px;
    padding: 0 10px;
    margin: 0;
    background: linear-gradient(180deg, #385b91, #294773);
    border: 1px solid rgba(111, 151, 210, 0.55);
    border-radius: 13px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

/* Hint and order count */
.date-order-count {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
    background: transparent;
    border: 0;
    color: #91b4ed;
    font-size: 12px;
    line-height: 18px;
}

.date-order-count strong {
    color: #a9c9ff;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}

/* Mobile */
@media (max-width: 480px) {
    .date-filter-card {
        padding: 23px 12px 13px;
        gap: 12px;
        border-radius: 17px;
    }

    .date-filter-card label {
        left: 17px;
        font-size: 14px;
    }

    .date-filter-controls {
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 8px;
    }

    .date-filter-card input[type="date"],
    .date-filter-card .today-btn {
        height: 52px;
    }
}

@media (max-width: 340px) {
    .date-filter-controls {
        grid-template-columns: minmax(0, 1fr) 76px;
        gap: 6px;
    }

    .date-filter-card {
        padding-right: 9px;
        padding-left: 9px;
    }
}


/* Only order cards area will scroll */
#ordersContainer {
    height: calc(100vh - 265px);
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

/* Hide scrollbar in Chrome, Edge and Safari */
#ordersContainer::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* Keep order cards inside the scrolling area */
#ordersContainer .order-card {
    flex-shrink: 0;
}



html,
body {
    height: 100%;
    overflow: hidden;
}

.app-container {
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
}

.container {
    height: calc(100vh - 74px);
    height: calc(100dvh - 74px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.date-filter-card {
    flex-shrink: 0;
}


</style>
</head>

<body>

    <div class="app-container">

        <div class="header">

            <button
                class="back-btn"
                onclick="history.back()"
            >
                ←
            </button>

            <h2>My Orders</h2>

        </div>


        
<div class="container">

   
<section class="date-filter-card">
    <label for="orderDateFilter">Filter orders by date</label>

    <div class="date-filter-controls">
        <input
            type="date"
            id="orderDateFilter"
            aria-label="Filter orders by date"
        >

        <button
            type="button"
            class="today-btn"
            onclick="resetOrderDateFilter()"
        >
            Today
        </button>
    </div>

    <div class="date-order-count" id="dateOrderCount">
        <span id="dateFilterHint">Showing orders placed today</span>
        <strong id="dateOrderTotal">0 orders</strong>
    </div>

    <!-- Yahan selected date ke orders render honge -->
<div id="ordersContainer">
    <div class="loading">
        Loading orders...
    </div>
</div>
</section>






</div>


    </div>

<script>

const authToken =
    localStorage.getItem("authToken");


// Check login
if (!authToken) {

    alert("Please login first.");

    window.location.href = "index.html";

}



let allOrders = [];

const orderDateFilter = document.getElementById("orderDateFilter");
const dateOrderCount = document.getElementById("dateOrderCount");

// Local date ko YYYY-MM-DD format mein badle
function getLocalDateKey(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "";

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

// Selected date ko readable format mein badle
function formatOrderDate(dateKey) {
    const parts = dateKey.split("-").map(Number);

    return new Date(parts[0], parts[1] - 1, parts[2])
        .toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
}

// API se orders load kare
async function loadOrders() {
    try {
        // Page khulte hi aaj ki date select hogi
        orderDateFilter.value = getLocalDateKey(new Date());

       const response = await fetch(
    "https://food-delivery-app-yrag.onrender.com/api/orders/my-orders",
    {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + authToken
        }
    }
);

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Failed to load orders");
        }

        allOrders = Array.isArray(data.orders) ? data.orders : [];

        renderFilteredOrders();

    } catch (error) {
        console.error("Load Orders Error:", error);

        dateOrderCount.textContent = "Order count load nahi hua.";

        document.getElementById("ordersContainer").innerHTML = `
            <div class="error">
                ${escapeHtml(error.message || "Failed to load orders")}
            </div>
        `;
    }
}

// Date badalte hi orders filter honge
orderDateFilter.addEventListener("change", renderFilteredOrders);

function renderFilteredOrders() {
    const selectedDate =
        orderDateFilter.value || getLocalDateKey(new Date());

    const filteredOrders = allOrders.filter(order => {
        return getLocalDateKey(order.createdAt) === selectedDate;
    });

    
dateOrderCount.innerHTML = `
    <span>
        ${selectedDate === getLocalDateKey(new Date())
            ? "Showing orders placed today"
            : "Showing orders for " + escapeHtml(formatOrderDate(selectedDate))}
    </span>
    <strong>${filteredOrders.length} orders</strong>
`;


    displayOrders(filteredOrders);
}

// Sirf selected date ke orders dikhaye
function displayOrders(orders) {
    const container = document.getElementById("ordersContainer");

    if (allOrders.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;">📦</div>
                <h3>No Orders Yet</h3>
                <p>You have not placed any order yet.</p>

                <button
                    class="btn view-btn"
                    style="max-width:220px;"
                    onclick="window.location.href='customer-restaurants.html'"
                >
                    🍔 Order Food
                </button>
            </div>
        `;
        return;
    }

    if (orders.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;">🗓️</div>
                <h3>No Orders on This Date</h3>
                <p>Is date par koi order nahi mila. Dusri date select karein.</p>
            </div>
        `;
        return;
    }

    // Latest order sabse upar
    const sortedOrders = [...orders].sort((a, b) =>
        new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
    );

    container.innerHTML = sortedOrders.map(order => {
        const restaurantName = order.restaurantId?.name || "Restaurant";

        const orderDate = order.createdAt
            ? new Date(order.createdAt).toLocaleString("en-IN")
            : "N/A";

        let statusClass = "";

        if (order.orderStatus === "DELIVERED") {
            statusClass = "delivered";
        }

        if (order.orderStatus === "CANCELLED") {
            statusClass = "cancelled";
        }

        const canTrack = ![
            "DELIVERED",
            "CANCELLED"
        ].includes(order.orderStatus);

        return `
            <div class="order-card">
                <div class="order-top">
                    <div class="restaurant">
                        🏪 ${escapeHtml(restaurantName)}
                    </div>

                    <span class="status ${statusClass}">
                        ${escapeHtml(order.orderStatus || "UNKNOWN")}
                    </span>
                </div>

                <div class="order-id">
                    Order ID: ${escapeHtml(String(order._id))}
                </div>

                <div class="order-info-grid">
                    <div class="order-info-box">
                        <span class="order-info-label">Payment</span>
                        <span class="order-info-value">
                            ${escapeHtml(order.paymentMethod || "N/A")}
                        </span>
                    </div>

                    <div class="order-info-box">
                        <span class="order-info-label">Payment Status</span>
                        <span class="order-info-value">
                            ${escapeHtml(order.paymentStatus || "N/A")}
                        </span>
                    </div>

                    <div class="order-info-box">
                        <span class="order-info-label">Total Amount</span>
                        <span class="order-info-value">
                            ₹${Number(order.totalAmount || 0).toFixed(2)}
                        </span>
                    </div>

                    <div class="order-info-box">
                        <span class="order-info-label">Order Status</span>
                        <span class="order-info-value">
                            ${escapeHtml(order.orderStatus || "UNKNOWN")}
                        </span>
                    </div>
                </div>

                <div class="order-date">
                    🕒 ${escapeHtml(orderDate)}
                </div>

                <div class="buttons">
                    <button
                        class="btn view-btn"
                        onclick="viewOrder('${order._id}')"
                    >
                        👁️ View Order
                    </button>

                    ${
                        canTrack
                            ? `
                                <button
                                    class="btn track-btn"
                                    onclick="trackOrder('${order._id}')"
                                >
                                    📍 Track Order
                                </button>
                            `
                            : ""
                    }
                </div>
            </div>
        `;
    }).join("");
}

function resetOrderDateFilter() {
    orderDateFilter.value = getLocalDateKey(new Date());
    renderFilteredOrders();
}

// View order
function viewOrder(orderId) {

    window.location.href =
        "customer-order.html?id=" +
        encodeURIComponent(orderId);

}


// Track order
function trackOrder(orderId) {

    window.location.href =
        "customer-tracking.html?orderId=" +
        encodeURIComponent(orderId);

}


// Basic HTML escape
function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// Load orders
loadOrders();

</script>

</body>
</html>
