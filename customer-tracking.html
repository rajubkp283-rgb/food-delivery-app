        function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {
    const R = 6371;

    const dLat =
        (lat2 - lat1) * Math.PI / 180;

    const dLon =
        (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


function calculateETA(distanceKm) {

    // Average delivery speed
    const averageSpeed = 25; // km/h

    const timeHours =
        distanceKm / averageSpeed;

    const timeMinutes =
        Math.ceil(timeHours * 60);

    if (timeMinutes <= 1) {
        return "Arriving soon";
    }

    return timeMinutes + " min";
}


// ===============================
// ETA COUNTDOWN
// ===============================

function startEtaCountdown(seconds) {

    currentEtaSeconds = seconds;

    if (etaCountdownTimer) {
        clearInterval(etaCountdownTimer);
    }

    function updateEtaDisplay() {

        const etaElement =
            document.getElementById("eta");

        if (!etaElement) {
            return;
        }

        if (currentEtaSeconds <= 60) {

            etaElement.innerText =
                "Arriving soon";

            return;
        }

        const minutes =
            Math.ceil(
                currentEtaSeconds / 60
            );

        etaElement.innerText =
            minutes + " min";

        currentEtaSeconds--;
    }

    updateEtaDisplay();

    etaCountdownTimer =
        setInterval(function() {

            if (currentEtaSeconds > 0) {
                updateEtaDisplay();
            } else {
                clearInterval(
                    etaCountdownTimer
                );
            }

        }, 1000);
}


// ===============================
// ROAD ROUTE FUNCTION
// ===============================

async function updateRoadRoute(
    customerLat,
    customerLng,
    deliveryLat,
    deliveryLng
) {

    const currentRequestId = ++routeRequestId;

    try {

        const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    deliveryLng + "," + deliveryLat +
    ";" +
    customerLng + "," + customerLat +
    "?overview=full&geometries=geojson";

        const response =
            await fetch(url);


        const data =
            await response.json();

            if (currentRequestId !== routeRequestId) {
            return;
            }

        if (
            !data.routes ||
            !data.routes.length
        ) {
            console.log(
                "Road route not found."
            );
            return;
        }

        const routeCoordinates =
            data.routes[0]
                .geometry
                .coordinates
                .map(function(point) {

                    return [
                        point[1],
                        point[0]
                    ];

                });

                // ===============================
// ACTUAL ROAD DISTANCE & ETA
// ===============================

const roadDistance =
    data.routes[0].distance;

const roadDuration =
    data.routes[0].duration;

// Distance in KM
const roadDistanceKm =
    roadDistance / 1000;

// Time in minutes
const roadEtaMinutes =
    Math.ceil(roadDuration / 60);


    // Start live ETA countdown
      startEtaCountdown(
    Math.ceil(roadDuration)
    );

console.log(
    "Road Distance:",
    roadDistanceKm.toFixed(2),
    "KM"
);

console.log(
    "Road ETA:",
    roadEtaMinutes,
    "minutes"
);



// Show actual road distance and ETA
const distanceElement =
    document.getElementById("distance");

const etaElement =
    document.getElementById("eta");

if (distanceElement) {
    distanceElement.innerText =
        roadDistanceKm.toFixed(2) + " KM";
}

if (etaElement) {
    etaElement.innerText =
        roadEtaMinutes + " min";
}

        if (!routeLine) {

    routeLine = L.polyline(
        routeCoordinates,
        {
            weight: 5,
            opacity: 0.8
        }
    ).addTo(map);

} else {

    routeLine.setLatLngs(
        routeCoordinates
    );

}



// Update remaining route progress
updateRouteProgress(
    deliveryLat,
    deliveryLng
);

    } catch (error) {

        console.error(

// ===============================
// ROUTE PROGRESS FUNCTION
// ===============================

function updateRouteProgress(
    deliveryLat,
    deliveryLng
) {

    if (!routeLine) {
        return;
    }

    const routePoints =
        routeLine.getLatLngs();

    if (
        !routePoints ||
        routePoints.length < 2
    ) {
        return;
    }

    const deliveryPosition =
        L.latLng(
            deliveryLat,
            deliveryLng
        );

    let nearestIndex = 0;
    let nearestDistance = Infinity;

    routePoints.forEach(
        function(point, index) {

            const distance =
                deliveryPosition.distanceTo(
                    point
                );

            if (distance < nearestDistance) {

                nearestDistance =
                    distance;

                nearestIndex =
                    index;
            }
        }
    );

    const remainingRoute =
        routePoints.slice(
            nearestIndex
        );

    if (remainingRoute.length >= 2) {

        routeLine.setLatLngs(
            remainingRoute
        );
    }
}



       function initializeMap(latitude, longitude) {

    if (map) {
        return;
    }

    map = L.map("map").setView(
        [latitude, longitude],
        16
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);
}

   const newPosition = [

</a>
        </div>

        <div style="

        ">
            🛵 ${deliveryBoy?.vehicleType || "Not available"}
        </div>

        ">

        <div style="

        </div>

                ${deliveryBoy?.phone ? `
        <a
            href="tel:${deliveryBoy.phone}"
            style="
                display:block;

            "
        >
            📞 Call Delivery Partner
        </a>
        ` : ""}

    </div>
`);

    } else {

    const startPosition =
        deliveryMarker.getLatLng();

    const endPosition =
        L.latLng(
            newPosition[0],
            newPosition[1]
        );

    const duration = 1000;
    const startTime = performance.now();

    function animateMarker(currentTime) {

        const elapsed =
            currentTime - startTime;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );

        const latitude =
            startPosition.lat +
            (
                endPosition.lat -
                startPosition.lat
            ) * progress;

        const longitude =
            startPosition.lng +
            (
                endPosition.lng -
                startPosition.lng
            ) * progress;

        deliveryMarker.setLatLng([
            latitude,
            longitude
        ]);

        if (progress < 1) {
            requestAnimationFrame(
                animateMarker
            );
        }
    }

    requestAnimationFrame(
        animateMarker
    );
}







    // ===============================
// KEEP MAP POSITION STABLE

if (customerMarker && deliveryMarker) {

}


        async function getOrderTracking() {

    if (!orderId) {
        showError("Order ID is missing.");
        updateConnectionStatus("Waiting", false);
        return;
    }

    if (!customerToken) {
        showError("Customer login token not found.");
        updateConnectionStatus("Login Required", false);
        return;
    }

    try {

        const response = await fetch(
            API_BASE +
            "/api/orders/" +
            orderId +
            "/tracking",
            {
                method: "GET",
                headers: {
                    "Authorization":
                        "Bearer " + customerToken
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Order tracking unavailable."
            );
        }

        const order = data.order;

const isGrocery =
    order.restaurant?.category === "Groceries";

// Customer Location
const customerLatitude =
    Number(order.deliveryAddress?.latitude);

const customerLongitude =
    Number(order.deliveryAddress?.longitude);



    // Show Customer Location
if (
    Number.isFinite(customerLatitude) &&
    Number.isFinite(customerLongitude)
) {
    if (!map) {
        initializeMap(
            customerLatitude,
            customerLongitude
        );
    }

    if (!customerMarker) {
        customerMarker =
            L.marker(
    [
        customerLatitude,
        customerLongitude
    ],
    {
        icon: customerIcon
    }
)
            .addTo(map)
            .bindPopup(
                "🏠 Customer Location"
            );
    } else {
        customerMarker.setLatLng([
            customerLatitude,
            customerLongitude
        ]);
    }
}

        // Update Order Status
const statusSteps = [

    {

    {

];

const currentStatusIndex =

document.getElementById(

document.getElementById(

    statusSteps.map((status, index) => {
