<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Groceries</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #090d20;
            color: #ffffff;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 2px);
            margin: 1px auto;

            background: #0b1224;

            border: 1px solid rgba(92, 125, 180, 0.75);
            border-radius: 7px;

            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 8px 30px rgba(0,0,0,0.45),
                0 0 18px rgba(70,120,255,0.18);

            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: none;
        }

        .app-container::-webkit-scrollbar {
            display: none;
        }

        .container {
            padding: 20px 15px 40px;
        }

        /* HEADER */

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 20px;
        }

        .back-button {
            width: 42px;
            height: 42px;

            border: 1px solid #2d4167;
            border-radius: 12px;

            background: #142039;
            color: #ffffff;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-content {
            flex: 1;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
        }

        .header-subtitle {
            margin-top: 4px;

            font-size: 12px;
            color: #91a0bb;
        }

        /* STORE LIST */

        .section-title {
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 12px;
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* STORE CARD */

        .store-card {
            background: #142039;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;

            border: 1px solid #2d4167;
            border-radius: 16px;

            padding: 12px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.20);
        }

        .store-top {
            display: flex;
            gap: 12px;
        }

        .store-image {
            width: 82px;
            height: 82px;

            flex-shrink: 0;

            border-radius: 14px;

            overflow: hidden;

            background: #202d49;
        }

        .store-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .store-info {
            min-width: 0;
            flex: 1;
        }

        .store-name {
            font-size: 17px;
            font-weight: 700;

            color: #ffffff;

            margin-bottom: 5px;
        }

        .store-owner {
            font-size: 12px;
            color: #aebbd1;

            margin-bottom: 6px;
        }

        .store-location {
            font-size: 12px;
            color: #91a0bb;

            line-height: 1.4;
        }

        .status-row {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-top: 8px;
        }

        .status {
            font-size: 11px;
            font-weight: 700;

            padding: 4px 8px;

            border-radius: 20px;
        }

        .status.open {
            color: #71e6a5;
            background: rgba(54, 211, 130, 0.12);
        }

        .status.closed {
            color: #ff8f8f;
            background: rgba(255, 80, 80, 0.12);
        }

        .category-badge {
            font-size: 11px;
            color: #b9c7df;
        }

        /* DETAILS */

        .store-details {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin-top: 12px;
        }

        .detail-box {
            background: #0e172b;

            border: 1px solid #263858;

            border-radius: 10px;

            padding: 8px 6px;

            text-align: center;
        }

        .detail-label {
            font-size: 9px;
            color: #71809b;

            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 11px;
            font-weight: 600;

            color: #dbe4f5;
        }

        /* DESCRIPTION */

        .store-description {
            margin-top: 11px;

            font-size: 12px;
            line-height: 1.5;

            color: #9eabc1;
        }

        /* BUTTON */

        .view-store-btn {
            width: 100%;

            margin-top: 12px;

            padding: 11px;

            border: none;
            border-radius: 10px;

            background: #36578F;
            color: #ffffff;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
        }

        .view-store-btn:active {
            transform: scale(0.98);
        }

        /* LOADING */

        .loading {
            text-align: center;

            padding: 40px 20px;

            color: #91a0bb;

            font-size: 13px;
        }

        /* EMPTY */

        .empty {
            text-align: center;

            padding: 50px 20px;

            color: #91a0bb;
        }

        .empty-icon {
            font-size: 45px;

            margin-bottom: 12px;
        }

        .empty-title {
            font-size: 17px;
            font-weight: 700;

            color: #ffffff;

            margin-bottom: 6px;
        }

        .empty-text {
            font-size: 12px;
            line-height: 1.5;
        }

        /* ERROR */

        .error {
            text-align: center;

            padding: 35px 20px;

            color: #ff8f8f;

            font-size: 13px;
        }

        
/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}


    </style>
</head>

<body>

<div class="app-container">

    <div class="container">

        <!-- HEADER -->

        <div class="page-header">

            <button
                class="back-button"
                onclick="window.location.href='food-index.html'"
            >
                ←
            </button>

            <div class="header-content">

                <div class="header-title">
                    🛒 Groceries
                </div>

                <div class="header-subtitle">
                    Grocery stores near you
                </div>

            </div>

        </div>


        <!-- STORE SECTION -->

        <div class="section-title">
            Grocery Stores
        </div>

        <div
            id="storeList"
            class="store-list"
        >

            <div class="loading">
                Loading grocery stores...
            </div>

        </div>

    </div>

</div>


<script>


async function loadCategoryStores(category) {
    const storeList = document.getElementById("storeList");

    storeList.innerHTML =
        '<div class="loading">Loading nearby shops...</div>';

    const latitude = localStorage.getItem("userLatitude");
    const longitude = localStorage.getItem("userLongitude");

    if (!latitude || !longitude) {
        storeList.innerHTML = `
            <div class="empty">
                Please select your delivery address first.
            </div>`;
        return;
    }

    try {
        const params = new URLSearchParams({
            latitude: latitude,
            longitude: longitude,
            category: category
        });

        const response = await fetch(
            "/api/products/nearest?" + params.toString()
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to load shops");
        }

        const stores = result.restaurants || [];

        if (!stores.length) {
            storeList.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">🏪</div>
                    <div class="empty-title">No nearby shops</div>
                    <div class="empty-text">
                        No shops found within 5 KM for this category.
                    </div>
                </div>`;
            return;
        }

        // Existing grocery page ka shop-card renderer yahan use hoga.
        renderCategoryStores(stores, category);

    } catch (error) {
        console.error("Category shops error:", error);
        storeList.innerHTML = `
            <div class="error">Shops load nahi ho paaye. Please try again.</div>`;
    }
}



/* RENDER NEARBY CATEGORY SHOPS */
function renderCategoryStores(stores, category) {
    const storeList = document.getElementById("storeList");

    if (!storeList) return;

    storeList.innerHTML = stores.map(function (store) {
        const storeId = String(store._id || "").replace(/'/g, "\\'");
        const storeName = escapeHtml(store.name || "Shop");
        const image = escapeHtml(store.image || "images/offer.jpg");
        const address = escapeHtml(
            [store.address, store.city].filter(Boolean).join(", ") ||
            "Location not available"
        );

        const status = store.isOpen
            ? '<span class="status open">● Open</span>'
            : '<span class="status closed">● Closed</span>';

        return `
            <div class="store-card"
                 onclick="openStore('${storeId}')">

                <div class="store-top">
                    <div class="store-image">
                        <img
                            src="${image}"
                            alt="${storeName}"
                            onerror="this.onerror=null;this.src='images/offer.jpg'"
                        >
                    </div>

                    <div class="store-info">
                        <div class="store-name">${storeName}</div>
                        <div class="store-location">📍 ${address}</div>

                        <div class="status-row">
                            ${status}
                            <span class="category-badge">
                                ${escapeHtml(category)}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="store-details">
                    <div class="detail-box">
                        <div class="detail-label">Rating</div>
                        <div class="detail-value">
                            ⭐ ${escapeHtml(store.rating || "New")}
                        </div>
                    </div>

                    <div class="detail-box">
                        <div class="detail-label">Delivery</div>
                        <div class="detail-value">
                            ${escapeHtml(store.deliveryTime || 30)} min
                        </div>
                    </div>

                    <div class="detail-box">
                        <div class="detail-label">Delivery Fee</div>
                        <div class="detail-value">
                            ₹${escapeHtml(store.deliveryFee ?? 30)}
                        </div>
                    </div>
                </div>

                <button
                    type="button"
                    class="view-store-btn"
                    onclick="event.stopPropagation(); openStore('${storeId}')"
                >
                    View Store
                </button>
            </div>
        `;
    }).join("");
}




/* OPEN STORE */

function openStore(storeId) {

    window.location.href =
        "grocery-store.html?id=" +
        encodeURIComponent(storeId);

}


/* SAFE HTML */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* LOAD */

loadCategoryStores("Electronics");

</script>

</body>
</html>
