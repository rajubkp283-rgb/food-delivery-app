<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodExpress - Login</title>

 <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>




/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:
        radial-gradient(
            circle at top,
            rgba(71,115,190,.16),
            transparent 38%
        ),
        #090d20;

    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* ================================
   SINGLE OUTER CARD
================================ */

.app-container{
    position:relative;

    width:100%;
    max-width:500px;

    height:100dvh;

    margin:0 auto;

    overflow:hidden;

    background:#0b1224;

    border-left:1px solid rgba(92,125,180,.55);
    border-right:1px solid rgba(92,125,180,.55);

    box-shadow:
        0 0 35px rgba(71,115,190,.15);

    display:flex;
    flex-direction:column;
}


/* ================================
   FOOD SLIDER
================================ */

.hero{
    position:relative;

    width:100%;
    height:31dvh;

    min-height:190px;
    max-height:250px;

    overflow:hidden;

    flex-shrink:0;

    background:#070b17;
}


.slider{
    display:flex;

    width:500%;
    height:100%;

    animation:foodSlider 18s infinite;
}


.slide{
    position:relative;

    width:20%;
    height:100%;

    flex-shrink:0;

    overflow:hidden;
}


.slide img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    filter:
        brightness(.72)
        saturate(1.08);
}


.slide::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08),
            rgba(0,0,0,.12),
            rgba(7,13,28,.68)
        );
}


/* ================================
   HERO TEXT
================================ */

.hero-text{
    position:absolute;

    z-index:5;

    left:20px;
    top:30px;

    max-width:280px;
}

.hero-text h1{
    font-size:clamp(
        27px,
        7vw,
        35px
    );

    line-height:1.03;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 3px 12px rgba(0,0,0,.55);
}

.hero-text h1 span{
    color:#ff3f4a;
}

.hero-text p{
    margin-top:7px;

    font-size:12px;

    line-height:1.4;

    color:#e1e9f7;

    text-shadow:
        0 2px 7px rgba(0,0,0,.55);
}


/* ================================
   CURVED LOGIN PANEL
================================ */

.login-panel{
    position:relative;

    z-index:10;

    flex:1;

    min-height:0;

    margin-top:-42px;

    padding:28px 22px 16px;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #0b1224 0%,
            #0c1529 100%
        );

    border-top:
        1px solid rgba(92,125,180,.45);

    border-radius:
        45px 45px 0 0;

    box-shadow:
        0 -15px 35px rgba(20,65,130,.35);
}


/* CURVE HIGHLIGHT */

.login-panel::before{
    content:"";

    position:absolute;

    left:15%;
    right:15%;

    top:-2px;

    height:4px;

    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(93,162,255,.65),
            transparent
        );
}


/* ================================
   LOGIN CONTENT
================================ */

.login-content{
    width:100%;
    max-width:430px;

    height:100%;

    margin:0 auto;

    display:flex;
    flex-direction:column;

    justify-content:center;
}


/* ================================
   LOGO
================================ */

.logo{
    text-align:center;

    font-size:32px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1px;

    margin-bottom:8px;
}

.logo .food{
    color:#fff;
}

.logo .express{
    color:#ff3f4a;
}


/* ================================
   WELCOME
================================ */

.welcome{
    text-align:center;

    margin-bottom:18px;
}

.welcome h2{
    font-size:22px;

    line-height:1.15;

    color:#fff;

    margin-bottom:5px;
}

.welcome p{
    font-size:11px;

    color:#8fa2c2;

    line-height:1.4;
}


/* ================================
   INPUT
================================ */

.input-group{
    position:relative;

    width:100%;

    margin-bottom:11px;
}

.input-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    z-index:3;

    font-size:17px;

    color:#b9cbe6;

    pointer-events:none;
}

.input-group input{
    width:100%;

    height:51px;

    padding:0 46px;

    border:
        1px solid #355482;

    border-radius:14px;

    outline:none;

    background:
        linear-gradient(
            135deg,
            #101d36,
            #12223f
        );

    color:#fff;

    font-size:13px;

    transition:.2s ease;
}

.input-group input::placeholder{
    color:#8fa7ce;
}

.input-group input:focus{
    border-color:#5e9aff;

    box-shadow:
        0 0 0 3px
        rgba(94,154,255,.10);
}


/* ================================
   PASSWORD EYE
================================ */

.password-eye{
    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    width:32px;
    height:32px;

    border:none;

    background:transparent;

    color:#cbd9ee;

    font-size:17px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* ================================
   LOGIN BUTTON
================================ */

.login-btn{
    width:100%;

    height:51px;

    margin-top:3px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ff5964,
            #ff3040
        );

    color:#fff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 9px 20px
        rgba(255,63,74,.22);

    transition:.2s ease;
}

.login-btn:active{
    transform:scale(.99);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* ================================
   AGREEMENT
================================ */

.agreement{
    display:flex;

    align-items:flex-start;

    gap:8px;

    margin:
        11px 2px 13px;

    color:#9cafca;

    font-size:9.5px;

    line-height:1.45;
}

.agreement input{
    width:16px;
    height:16px;

    flex-shrink:0;

    margin-top:1px;

    accent-color:#ff3f4a;

    cursor:pointer;
}

.agreement a{
    color:#5e9aff;

    text-decoration:none;

    font-weight:700;
}


/* ================================
   MESSAGE
================================ */

.message{
    display:none;

    padding:7px 9px;

    margin-bottom:6px;

    border-radius:8px;

    font-size:9px;

    line-height:1.3;
}

#errorMessage{
    color:#ff7b83;

    background:rgba(255,63,74,.10);

    border:
        1px solid
        rgba(255,63,74,.25);
}

#successMessage{
    color:#69d28f;

    background:rgba(105,210,143,.10);

    border:
        1px solid
        rgba(105,210,143,.25);
}


/* ================================
   OR
================================ */

.or-divider{
    display:flex;

    align-items:center;

    gap:10px;

    margin:
        4px 0 12px;

    color:#7186a9;

    font-size:10px;

    font-weight:700;
}

.or-divider::before,
.or-divider::after{
    content:"";

    height:1px;

    flex:1;

    background:
        rgba(92,125,180,.25);
}


/* ================================
   SOCIAL
================================ */

.social-buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.social-btn{
    height:43px;

    border-radius:12px;

    border:
        1px solid
        rgba(92,125,180,.28);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    font-size:11px;

    font-weight:700;

    cursor:pointer;

    transition:.2s ease;
}

.google-btn{
    background:#fff;
    color:#17233b;
}

.facebook-btn{
    background:#1877f2;
    color:#fff;

    border-color:#3287f4;
}

.social-icon{
    font-size:17px;

    font-weight:900;
}


/* ================================
   SIGN UP
================================ */

.signup{
    text-align:center;

    margin-top:13px;

    color:#8297b9;

    font-size:11px;
}

.signup a{
    color:#ff4a55;

    font-weight:800;

    text-decoration:none;

    margin-left:3px;
}


/* ================================
   BACK
================================ */

.back-link{
    display:block;

    text-align:center;

    margin-top:8px;

    color:#6f8fbe;

    font-size:10px;

    text-decoration:none;
}


/* ================================
   SLIDER ANIMATION
================================ */

@keyframes foodSlider{

    0%,15%{
        transform:translateX(0);
    }

    20%,35%{
        transform:translateX(-20%);
    }

    40%,55%{
        transform:translateX(-40%);
    }

    60%,75%{
        transform:translateX(-60%);
    }

    80%,95%{
        transform:translateX(-80%);
    }

    100%{
        transform:translateX(0);
    }
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

    .app-container{
        width:100%;
        height:100dvh;

        min-height:100dvh;

        border-left:none;
        border-right:none;

        box-shadow:none;
    }

    .hero{
        height:27dvh;

        min-height:205px;
        max-height:245px;
    }

    .slide img{
        object-fit:cover;
        object-position:center center;
    }

    .hero-text{
        left:18px;
        top:27px;

        max-width:250px;
    }

    .hero-text h1{
        font-size:28px;

        line-height:1.03;
    }

    .hero-text p{
        font-size:10.5px;

        max-width:205px;

        margin-top:7px;
    }

    .login-panel{
        margin-top:-34px;

        padding:
            25px 18px 12px;

        border-radius:
            40px 40px 0 0;
    }

    .login-content{
        justify-content:center;

        max-width:430px;

        margin:0 auto;
    }

    .logo{
        font-size:29px;
        margin-bottom:7px;
    }

    .welcome{
        margin-bottom:16px;
    }

    .welcome h2{
        font-size:21px;
        margin-bottom:4px;
    }

    .welcome p{
        font-size:10.5px;
    }

    .input-group{
        margin-bottom:10px;
    }

    .input-group input{
        height:49px;

        border-radius:13px;

        font-size:12.5px;
    }

    .input-icon{
        left:14px;
        font-size:17px;
    }

    .password-eye{
        right:11px;
        font-size:16px;
    }

    .login-btn{
        height:49px;

        border-radius:13px;

        font-size:14px;

        margin-top:2px;
    }

    .agreement{
        margin:
            10px 1px 12px;

        gap:7px;

        font-size:9px;

        line-height:1.4;
    }

    .agreement input{
        width:15px;
        height:15px;
    }

    .or-divider{
        margin:
            4px 0 11px;

        font-size:9.5px;
    }

    .social-buttons{
        gap:10px;
    }

    .social-btn{
        height:42px;

        border-radius:11px;

        font-size:10.5px;
    }

    .signup{
        margin-top:12px;

        font-size:13.5px;
    }

    .back-link{
        margin-top:7px;

        font-size:13.5px;
    }
}


/* ================================
   SMALL MOBILE
================================ */

@media(max-width:360px){

    .hero{
        height:25dvh;

        min-height:185px;
        max-height:215px;
    }

    .hero-text{
        left:16px;
        top:23px;
    }

    .hero-text h1{
        font-size:25px;
    }

    .hero-text p{
        font-size:9.5px;
    }

    .login-panel{
        margin-top:-30px;

        padding:
            21px 15px 9px;

        border-radius:
            34px 34px 0 0;
    }

    .logo{
        font-size:26px;
    }

    .welcome{
        margin-bottom:13px;
    }

    .welcome h2{
        font-size:19px;
    }

    .input-group input{
        height:46px;
        font-size:11.5px;
    }

    .login-btn{
        height:46px;
    }

    .social-btn{
        height:39px;
        font-size:9.5px;
    }
}


/* =================================
   PREMIUM HERO SIDE CONTROLS
================================= */

.hero-side-controls{

    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    z-index:40;

    display:flex;

    flex-direction:column;

    gap:12px;
}


/* =================================
   ARROWS
================================= */

.side-arrow{

    width:36px;
    height:36px;

    padding:0;

    border-radius:50%;

    border:1px solid
        rgba(255,255,255,.30);

    background:
        rgba(8,17,34,.82);

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:27px;

    line-height:1;

    cursor:pointer;

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    box-shadow:
        0 6px 18px rgba(0,0,0,.35);

    transition:
        .2s ease;
}


.side-arrow:active{

    transform:scale(.88);
}


.side-arrow:hover{

    background:#36578F;

    border-color:
        rgba(255,255,255,.50);
}


/* =================================
   BUTTON PANEL
================================= */

.side-action-panel{

    position:absolute;

    right:53px;

    top:50%;

    transform:translateY(-50%);

    width:175px;

    height:84px;

    z-index:39;

    pointer-events:none;
}


/* =================================
   COMMON ACTION BUTTON
================================= */

.side-action{

    position:absolute;

    right:0;

    width:175px;

    height:36px;

    border:none;

    border-radius:12px;

    padding:5px 9px;

    display:flex;

    align-items:center;

    gap:8px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #243d68,
            #101c32
        );

    border:
        1px solid
        rgba(130,170,230,.35);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.38);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    opacity:0;

    visibility:hidden;

    pointer-events:auto;

    cursor:pointer;

    transition:
        transform .4s
        cubic-bezier(.22,.61,.36,1),
        opacity .3s ease,
        visibility .3s ease;
}


/* =================================
   RESTAURANT
   TOP ARROW KE SAMNE
================================= */

.restaurant-action{

    top:0;

    transform:
        translateX(190px);
}


.restaurant-action.active{

    opacity:1;

    visibility:visible;

    transform:
        translateX(0);
}


/* =================================
   DELIVERY BOY
   BOTTOM ARROW KE SAMNE
================================= */

.delivery-action{

    top:48px;

    transform:
        translateX(190px);
}


.delivery-action.active{

    opacity:1;

    visibility:visible;

    transform:
        translateX(0);
}


/* =================================
   ICON
================================= */

.action-icon{

    width:26px;
    height:26px;

    flex:0 0 26px;

    border-radius:8px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(54,87,143,.45);

    font-size:14px;
}


/* =================================
   TEXT
================================= */

.action-text{

    flex:1;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1.05;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;
}


.action-text small{

    color:#9eb1d0;

    font-size:7px;

    font-weight:500;

    margin-bottom:2px;
}


/* =================================
   RIGHT ARROW INSIDE BUTTON
================================= */

.action-arrow{

    font-size:17px;

    color:#a9c1e7;
}


/* =================================
   MOBILE
================================= */

@media(max-width:360px){

    .hero-side-controls{

        right:7px;

        gap:10px;
    }


    .side-arrow{

        width:33px;
        height:33px;

        font-size:24px;
    }


    .side-action-panel{

        right:47px;

        width:160px;

        height:76px;
    }


    .side-action{

        width:160px;

        height:33px;
    }


    .delivery-action{

        top:43px;
    }

}


.side-arrow img {
    width: 19px;
    height: 19px;
    object-fit: contain;
    display: block;
    transition: transform .2s ease;
}

.side-arrow:active img {
    transform: translateX(3px);
}


/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}


</style>
</head>


<body>

<!-- =================================
     SINGLE OUTER CARD
================================= -->

<div class="app-container">


    <!-- ================================
         FOOD IMAGE SLIDER
    ================================= -->

    <section class="hero">

        <div class="slider">

            <div class="slide">
                <img
                    src="images/login-food-1.jpg"
                    alt="Food"
                >
            </div>

            <div class="slide">
                <img
                    src="images/login-food-2.jpg"
                    alt="Food"
                >
            </div>

            <div class="slide">
                <img
                    src="images/login-food-3.jpg"
                    alt="Food"
                >
            </div>

            <div class="slide">
                <img
                    src="images/login-food-4.jpg"
                    alt="Food"
                >
            </div>

            <div class="slide">
                <img
                    src="images/login-food-5.jpg"
                    alt="Food"
                >
            </div>

        </div>


        <!-- HERO TEXT -->

        <div class="hero-text">

            <h1>
                Good Food,
                <br>
                <span>Good Mood</span>
            </h1>

            <p>
                Delicious food,
                delivered right
                to your doorstep
            </p>

        </div>



        <!-- PREMIUM SIDE CONTROLS -->

<div class="hero-side-controls">

    <button
        type="button"
        class="side-arrow"
        id="restaurantArrow"
        aria-label="Restaurant"
    >
        <img src="./images/shop.png" alt="Delivery Boy">
    </button>

    <button
        type="button"
        class="side-arrow"
        id="deliveryArrow"
        aria-label="Delivery Boy"
    >
         <img src="./images/delivery-boy.png" alt="Delivery Boy">

    </button>

</div>


<!-- SLIDE ACTION BUTTONS -->

<div class="side-action-panel">

    <button
        type="button"
        class="side-action restaurant-action"
        id="restaurantAction"
        onclick="window.location.href='restaurant-login.html'"
    >
        <span class="action-icon">🍽️</span>

        <span class="action-text">
            <small>For Partners</small>
            Restaurant
        </span>

        <span class="action-arrow">›</span>
    </button>


    <button
        type="button"
        class="side-action delivery-action"
        id="deliveryAction"
        onclick="window.location.href='delivery-boy-login.html'"
    >
        <span class="action-icon">🚴</span>

        <span class="action-text">
            <small>Delivery Partner</small>
            Delivery Boy
        </span>

        <span class="action-arrow">›</span>
    </button>

</div>

    </section>



    <!-- ================================
         LOGIN PANEL
    ================================= -->

    <main class="login-panel">

        <div class="login-content">


            <!-- LOGO -->

            <div class="logo">

                <span class="food">
                    Food
                </span>

                <span class="express">
                    Express
                </span>

            </div>



            <!-- WELCOME -->

            <div class="welcome">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Login to continue ordering
                    delicious food
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- MOBILE -->

                <div class="input-group">

                    <span class="input-icon">
                        📱
                    </span>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        autocomplete="tel"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-eye"
                        id="passwordEye"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login →
                </button>



                <!-- AGREEMENT -->

                <label class="agreement">

                    <input
                        type="checkbox"
                        id="agreement"
                    >

                    <span>

                        I agree to the

                        <a href="#">
                            Terms & Conditions
                        </a>

                        ,

                        <a href="#">
                            Privacy Policy
                        </a>

                        and

                        <a href="#">
                            User Agreement
                        </a>

                    </span>

                </label>



                <!-- ERROR -->

                <div
                    id="errorMessage"
                    class="message"
                ></div>


                <!-- SUCCESS -->

                <div
                    id="successMessage"
                    class="message"
                ></div>

            </form>



            <!-- OR -->

            <div class="or-divider">
                OR
            </div>



            <!-- SOCIAL -->

            <div class="social-buttons">

                <button
                    type="button"

<script>

/* ================================
   PASSWORD SHOW / HIDE
================================ */

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("passwordEye");

    if(password.type === "password"){

        password.type = "text";

        eye.textContent = "🙈";

    }else{

        password.type = "password";

        eye.textContent = "👁";

    }
}


/* ================================
   GOOGLE LOGIN
================================ */

function googleLogin(){

    alert(
        "Google Login will be connected later."
    );

}


/* ================================
   FACEBOOK LOGIN
================================ */

function facebookLogin(){

    alert(
        "Facebook Login will be connected later."
    );

}


/* ================================
   LOGIN
================================ */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const agreement =
            document
                .getElementById("agreement")
                .checked;


        /* VALIDATION */

        if(!phone || !password){

            errorMessage.textContent =
                "Please enter mobile number and password.";

            errorMessage.style.display =
                "block";

            return;
        }


        if(!agreement){

            errorMessage.textContent =
                "Please accept the Terms & Conditions to continue.";

            errorMessage.style.display =
                "block";

            return;
        }


        /* BUTTON */

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            const response =
                await fetch(
                    "/api/auth/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                phone:phone,
                                password:password
                            })
                    }
                );


            const data =
                await response.json();


            if(
                !response.ok ||
                !data.token
            ){

                throw new Error(
                    data.message ||
                    "Login failed"
                );

            }


            /* SAVE TOKEN */

            localStorage.setItem(
                "authToken",
                data.token
            );


            /* ADMIN TOKEN */

            if(data.isAdmin){

                localStorage.setItem(
                    "adminToken",
                    data.token
                );

            }


            /* SUCCESS */

            successMessage.textContent =
                "Login successful!";

            successMessage.style.display =
                "block";


            setTimeout(
                function(){

                    window.location.href =
                        "food-index.html";

                },
                500
            );


        }catch(error){

            console.error(
                "Food Login Error:",
                error
            );


            errorMessage.textContent =
                error.message ||
                "Login failed. Please try again.";


            errorMessage.style.display =
                "block";


        }finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login →";

        }

    }
);


const restaurantArrow =
    document.getElementById("restaurantArrow");

const deliveryArrow =
    document.getElementById("deliveryArrow");

const restaurantAction =
    document.getElementById("restaurantAction");

const deliveryAction =
    document.getElementById("deliveryAction");


/* =================================
   TOP ARROW → RESTAURANT
================================= */

restaurantArrow.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        deliveryAction.classList.remove(
            "active"
        );

        restaurantAction.classList.add(
            "active"
        );

    }
);


/* =================================
   BOTTOM ARROW → DELIVERY BOY
================================= */

deliveryArrow.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        restaurantAction.classList.remove(
            "active"
        );

        deliveryAction.classList.add(
            "active"
        );

    }
);


/* =================================
   PAGE PAR KAHIN BHI CLICK
   → OPEN BUTTON CLOSE
================================= */

document.addEventListener(
    "click",
    function(event) {

        /* Arrow par click hua */
        if (
            event.target.closest(
                ".side-arrow"
            )
        ) {
            return;
        }


        /* Restaurant / Delivery button
           par click hua */
        if (
            event.target.closest(
                ".side-action"
            )
        ) {
            return;
        }


        /* Kisi aur jagah click hua */

        restaurantAction.classList.remove(
            "active"
        );

        deliveryAction.classList.remove(
            "active"
        );

    }
);




</script>

</body>
</html>
