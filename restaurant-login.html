
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#090d20;
}

body{
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(54,87,143,.22),
            transparent 38%
        ),
        #090d20;
}


/* =========================
   MAIN CARD
========================= */

.login-box{

    width:100%;
    max-width:430px;

    background:#0b1224;

    border:1px solid #2d4167;

    border-radius:22px;

    padding:28px 20px 24px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.45),
        0 0 30px rgba(54,87,143,.10);
}


/* =========================
   LOGO
========================= */

.logo-wrap{

    width:72px;
    height:72px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #182947,
            #101a30
        );

    border:1px solid #2d4167;

    box-shadow:
        0 10px 25px rgba(0,0,0,.30);

    font-size:35px;
}


/* =========================
   HEADER
========================= */

.header{
    text-align:center;

    margin-bottom:28px;
}

.header h1{

    font-size:26px;

    color:#fff;

    font-weight:800;

    margin-bottom:8px;
}

.header p{

    color:#8fa2c2;

    font-size:13px;

    line-height:1.5;
}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:18px;
}

label{

    display:block;

    color:#dbe4f5;

    font-size:13px;

    font-weight:600;

    margin-bottom:8px;
}


/* =========================
   INPUT
========================= */

.input-box{

    position:relative;
}

.input-icon{

    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:#8295b4;

    font-size:15px;

    pointer-events:none;
}

input{

    width:100%;
    height:52px;

    padding:0 14px 0 42px;

    background:#142039;

    border:1px solid #2d4167;

    border-radius:12px;

    outline:none;

    color:#fff;

    font-size:14px;

    transition:.2s;
}

input::placeholder{
    color:#71819d;
}

input:focus{

    border-color:#557bb8;

    background:#172744;

    box-shadow:
        0 0 0 3px rgba(70,120,255,.10);
}


/* =========================
   BUTTON
========================= */

button{

    width:100%;
    height:52px;

    margin-top:4px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff3f4a,
            #e92f3c
        );

    color:#fff;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(255,63,74,.18);

    transition:.2s;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:20px;

    margin-top:16px;

    text-align:center;

    font-size:13px;
}


/* =========================
   REGISTER LINK
========================= */

.register-link{

    text-align:center;

    margin-top:22px;

    color:#7f91af;

    font-size:13px;

    line-height:1.6;
}

.register-link a{

    color:#ff3f4a;

    text-decoration:none;

    font-weight:700;
}

.register-link a:hover{
    text-decoration:underline;
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

    body{
        padding:10px;
    }

    .login-box{
        padding:24px 16px 20px;
        border-radius:18px;
    }

    .logo-wrap{
        width:64px;
        height:64px;
        font-size:31px;
    }

    .header h1{
        font-size:23px;
    }

    input,
    button{
        height:50px;
    }
}


/* Remove blue tap highlight and click flash */
* {
    -webkit-tap-highlight-color: transparent;
}

button,
button:focus,
button:focus-visible,
button:active,
[role="button"],
[role="button"]:focus,
[role="button"]:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* Remove default focus ring from clickable controls */
button:focus-visible {
    box-shadow: none !important;
}

</style>

</head>

<body>


<div class="login-box">


    <div class="logo-wrap">
        🍽️
    </div>


    <div class="header">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your restaurant dashboard
        </p>

    </div>


    <form id="loginForm">


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ☎
                </span>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            id="loginButton"
        >
            Login to Dashboard
        </button>


    </form>


    <div
        class="message"
        id="message"
    ></div>


    <div class="register-link">

        Don't have a restaurant account?

        <a href="restaurant-register.html">
            Create Account
        </a>

    </div>


</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(event){

    event.preventDefault();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const loginButton =
        document
        .getElementById("loginButton");


    message.textContent="";

    loginButton.disabled=true;

    loginButton.textContent="Logging in...";


    try{

        const response =
            await fetch(
                "/api/restaurants/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        password:password
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Login failed"
            );
        }


        localStorage.setItem(
            "restaurantToken",
            data.token
        );


        message.style.color="#4ade80";

        message.textContent =
            "Login successful. Opening dashboard...";


        setTimeout(function(){

            window.location.href =
                "restaurant-dashboard.html";

        },500);


    }
    catch(error){

        console.error(
            "Restaurant Login Error:",
            error
        );


        message.style.color="#ff6b73";

        message.textContent =
            error.message ||
            "Something went wrong";

    }
    finally{

        loginButton.disabled=false;

        loginButton.textContent =
            "Login to Dashboard";

    }

});

</script>

</body>
</html>
